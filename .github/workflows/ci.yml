name: CI - Testes, Migrações e Execução
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Testes automatizados
        run: python -m pytest -v
      - name: Criar banco e aplicar Expand + Backfill
        run: |
          python -c "from database import inicializar_banco; inicializar_banco()"
          python scripts/migrar.py --ate 2
      - name: Executar lote ponta a ponta
        run: python main.py
      - name: Verificar 10 registros e estados
        run: |
          python -c "import sqlite3; db=sqlite3.connect('sistema.db'); assert db.execute('select count(*) from transacoes').fetchone()[0] == 10; assert db.execute("select count(*) from transacoes where status='REJEITADO'").fetchone()[0] == 3"
      - name: Validar etapa Contract em cópia do banco
        run: |
          cp sistema.db contrato.db
          python scripts/migrar.py --banco contrato.db --ate 3
      - name: Salvar log como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ci
          path: app.log
          if-no-files-found: ignore
